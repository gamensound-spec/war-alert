name: daily-monitor
on:
  schedule:
    - cron: "47 23 * * *"   # 매일 KST 08:47
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "경보가 없어도 텔레그램으로 요약 보내기 (설정 확인용)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python daily_report.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
      - name: 누적 데이터 저장
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "data $(date -u +%F)" || echo "no change"
          git push
